<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chat</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f7f3f5;
            color: #333;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: #f0e6eb;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            border-right: 1px solid #e2d1d7;
        }

        .sidebar-top h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #4a2e35;
        }

        .new-chat-btn {
            background-color: #fff;
            border: 1px solid #d5c2cb;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
            width: 100%;
        }

        .chat-history h4 {
            font-size: 12px;
            color: #7a626a;
            margin-bottom: 10px;
        }

        .chat-history ul {
            list-style: none;
        }

        .chat-history li {
            padding: 8px 10px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .chat-history li:hover {
            background-color: #e4d3db;
        }

        .sidebar-bottom {
            border-top: 1px solid #e2d1d7;
            padding-top: 15px;
        }

        .sidebar-bottom div {
            padding: 8px 0;
            font-size: 14px;
            cursor: pointer;
            color: #555;
        }

        
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            position: relative;
        }

        .chat-header {
            font-size: 16px;
            color: #666;
        }

        .chat-body {
            text-align: center;
            max-width: 600px;
            margin: auto;
        }

        .chat-body h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        .chat-body p {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
        }

        /* Input Area Styling */
        .chat-input-container {
            display: flex;
            align-items: center;
            background-color: #fff;
            border: 1px solid #d5c2cb;
            border-radius: 30px;
            padding: 10px 20px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .chat-input-container input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
        }

        .chat-input-container button {
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Sidebar Section -->
    <div class="sidebar">
        <div class="sidebar-top">
            <h2>💬 My AI</h2>
            <button class="new-chat-btn">+ New Chat</button>
            
            <div class="chat-history">
                <h4>Today</h4>
                <ul>
                    <li>Explain HTML basics</li>
                    <li>CSS project ideas</li>
                    <li>Operating System notes</li>
                </ul>
            </div>
        </div>

        <div class="sidebar-bottom">
            <div>⚙️ Settings</div>
            <div>❓ Help</div>
            <div>👤 Student</div>
        </div>
    </div>

    <!-- Main Chat Section -->
    <div class="main-chat">
        <div class="chat-header">
            My AI ▾
        </div>

        <div class="chat-body">
            <h1>How can I help you?</h1>
            <p>Ask me anything. I can help you learn, write, code and explore ideas.</p>
        </div>

        <div class="chat-input-container">
            <input type="text" placeholder="Message My AI...">
            <button>↑</button>
        </div>
    </div>

</body>
</html>
